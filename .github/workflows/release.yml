name: Release

# Pushing a version tag (git tag v0.1.6 && git push origin v0.1.6) publishes
# the GitHub release with that version's CHANGELOG.md section. Bots pin cmcall
# by commit in requirements.txt, so the release is the readable changelog of
# what that commit is.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and take the notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qx "version = \"$VERSION\"" pyproject.toml; then
            echo "::error::pyproject.toml has $(grep '^version' pyproject.toml), not $VERSION"
            exit 1
          fi
          # the "## X.Y.Z" section up to the next "## "
          awk -v head="## $VERSION" '
            index($0, "## ") == 1 { if (found) exit; found = ($0 == head); next }
            found' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section ## $VERSION"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
