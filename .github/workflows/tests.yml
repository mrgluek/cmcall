name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install coturn (for the relay-only test)
        run: sudo apt-get update && sudo apt-get install -y coturn
      - name: Start coturn
        run: |
          turnserver -n --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 \
            --user=u:p --realm=test --lt-cred-mech --no-tls --no-dtls \
            --allow-loopback-peers --no-cli --log-file=stdout > turn.log 2>&1 &
          sleep 2
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
